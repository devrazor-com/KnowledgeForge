<form method="post" action="/packages/{{ src.id }}/profile" class="run-grid">
  <div class="field">
    <label>Target environment</label>
    <select name="environment" required>
      {% for e in environments %}<option value="{{ e }}"{% if profile and e == profile.target_environment %} selected{% endif %}>{{ e }}</option>{% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Permitted capabilities</label>
    <div class="caps">
      {% for c in capabilities %}
      <label class="cap"><input type="checkbox" name="capabilities" value="{{ c }}"
        {% if profile and c in profile.capabilities %}checked{% elif not profile and c in ['filesystem', 'shell'] %}checked{% endif %}/> {{ c }}</label>
      {% endfor %}
    </div>
  </div>
  <div class="field">
    <label>Your name (recorded)</label>
    <input type="text" name="configured_by" value="{{ profile.configured_by if profile and profile.configured_by else '' }}"
           placeholder="e.g. victor" style="font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px"/>
  </div>
  <div class="field" style="align-self:end"><button type="submit" class="primary">Save profile</button></div>
</form>
