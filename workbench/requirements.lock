# KnowledgeForge Module 1 — pinned dependency lock (reproducible integration env).
#
# Generated on macOS/Python 3.12 from workbench/requirements.txt. Install with:
#     pip install -r workbench/requirements.lock
#
# This pins the FULL transitive closure so a fresh Mac and Windows environment
# resolve to materially the same dependency set. Platform-conditional packages carry
# an environment marker rather than being silently included/omitted:
#
#   * colorama is a Windows-only dependency of click and pytest; it is absent on a
#     macOS install and must NOT be an unconditional pin. The marker below installs
#     it on Windows only. (A naive macOS `pip freeze` would drop it entirely — which
#     is exactly the platform-drift this lock is meant to prevent.)
#   * uvloop is intentionally NOT present: we install plain `uvicorn`, not
#     `uvicorn[standard]`, so its POSIX-only uvloop extra is never pulled in.
#
# A lock cannot guarantee byte-identical trees across OSes without hashes, but it
# pins every package + version and marks the platform-conditional ones explicitly.
